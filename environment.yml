# Conda env for rendering the analysis document.
#
# ipykernel installs a `python3` kernel inside the env, which is the kernel the `jupyter:` line
# in txn1-expression-retina.qmd names. Activating the env is all that is needed for quarto to
# find it — there is no kernel to register anywhere else:
#
#   conda env create -f environment.yml
#   conda activate oir-analysis-3
#
# Quarto is listed here so its version is pinned alongside the python side. With the env
# active, the copy in it is the one that renders, whatever else is on PATH.
name: oir-analysis-3

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.12
  - quarto
  - anndata
  - scanpy
  - scipy
  - numpy
  - pandas
  # sc.tl.leiden is called with flavor="igraph", which uses python-igraph directly —
  # leidenalg is the other flavor's backend and is deliberately not installed.
  - python-igraph
  - matplotlib
  - seaborn
  # DataFrame.to_markdown() is what renders the tables in the report.
  - tabulate
  # Quarto renders through a Jupyter kernel.
  - ipykernel
  - nbformat
  - nbclient

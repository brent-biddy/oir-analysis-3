# Conda env for rendering txn1-expression-retina.qmd. Activate it before rendering.
name: oir-analysis-3

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.12
  - quarto
  - anndata
  - scanpy
  - scipy
  - numpy
  - pandas
  - python-igraph
  - matplotlib
  - seaborn
  - tabulate
  - ipykernel
  - nbformat
  - nbclient

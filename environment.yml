# Conda env for rendering the analysis document.
#
# ipykernel installs a `python3` kernel inside the env, which is the kernel the `jupyter:` line
# in txn1-expression-retina.qmd names. Activating the env is all that is needed for quarto to
# find it — there is no kernel to register anywhere else:
#
#   conda env create -f environment.yml
#   conda activate oir-analysis-3
name: oir-analysis-3

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.12
  - quarto
  - anndata
  - scanpy
  - scipy
  - numpy
  - pandas
  - python-igraph
  - matplotlib
  - seaborn
  - tabulate
  - ipykernel
  - nbformat
  - nbclient
